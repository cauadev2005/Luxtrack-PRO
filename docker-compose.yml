services:
  luxtrack-db:
    image: postgis/postgis:16-3.4
    container_name: luxtrack-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: luxtrack
      POSTGRES_USER: luxtrack
      POSTGRES_PASSWORD: luxtrack_dev
    ports:
      - "5432:5432"
    volumes:
      - luxtrack_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxtrack -d luxtrack"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  luxtrack_postgres_data:
